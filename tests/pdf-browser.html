<!doctype html><html lang="de"><meta charset="utf-8"><h1>PDF-Exporttest</h1><label>Vorlage <input id="file" type="file"></label><pre id="results">Vorlage auswählen</pre><div id="downloads"></div><label>Seite<select id="page"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><div id="pages"></div><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script type="module">
import {exportWorkbook,readWorkbook} from '../waerme/workbook.mjs';import {exportReportPdf,reportValues} from '../waerme/report-pdf.mjs';
document.querySelector('#file').onchange=async e=>{try{const data={project:{object:'Testweg 12, 8000 Zürich',deliveryDate:'2026-11-12',timeBudget:'40 h',amp:315,icp:10,city:'Zürich',pl:'Kunden-PL',customer:'Testkunde & Partner AG',name:'Hauptverteilung',order:'AU-TEST',type:'SBR',date:'2026-10-29'},fields:[{type:'SBR',b:1000,h:2000,t:300,max:500,selected:320,base:300,surchargeW:20,percent:50,mode:'manual'}],devices:[]},buffer=await e.target.files[0].arrayBuffer(),excel=await exportWorkbook(buffer,JSZip,data);const w=await readWorkbook(await excel.arrayBuffer(),JSZip),v=reportValues(w.sheets);let checks=0;const check=(b,s)=>{if(!b)throw Error(s);checks++;};check(v('Bauartnachweis','B8')==='AU-TEST','Auftrag');check(v('Konformität','B18').includes('Testweg 12'),'Objekt');check(v('Temperaturnachweis','B13')===320,'Pv');check(v('Temperaturnachweis','B15')===500,'MaxPv');check(v('Temperaturnachweis','B16')===180,'Reserve');check(v('Stücknachweis','C36')==='ü'&&v('Stücknachweis','C37')==='','315 A Haken');const pdf=await exportReportPdf(excel,JSZip);const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';const parsed=await pdfjs.getDocument({data:new Uint8Array(await pdf.arrayBuffer())}).promise;check(parsed.numPages===4,'Vier PDF-Seiten');for(let i=1;i<=4;i++){const page=await parsed.getPage(i),canvas=document.createElement('canvas'),vp=page.getViewport({scale:1});canvas.width=vp.width;canvas.height=vp.height;canvas.dataset.page=i;canvas.style.display=i===1?'block':'none';await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;document.querySelector('#pages').append(canvas);}document.querySelector('#page').onchange=e=>document.querySelectorAll('canvas').forEach(c=>c.style.display=c.dataset.page===e.target.value?'block':'none');for(const [blob,name] of [[pdf,'test-konformitaet.pdf'],[excel,'test-export.xlsx']]){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.textContent=name;document.querySelector('#downloads').append(a,document.createElement('br'));}document.querySelector('#results').textContent=checks+' Wertprüfungen bestanden. PDF '+pdf.size+' Bytes erstellt.';}catch(e){document.querySelector('#results').textContent='FEHLER: '+e.message;}};
</script></html>
