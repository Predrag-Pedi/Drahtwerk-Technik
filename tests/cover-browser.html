<!doctype html><html lang="de"><meta charset="utf-8"><h1>Deckblatt-Exporttest</h1><input id="file" type="file"><pre id="results">Vorlage auswählen</pre><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script type="module">
import {readWorkbook,exportWorkbook} from '../waerme/workbook.mjs';
document.querySelector('#file').onchange=async e=>{const out=document.querySelector('#results');try{const buffer=await e.target.files[0].arrayBuffer(),original=await readWorkbook(buffer,JSZip);let checks=0;const ok=(b,msg)=>{if(!b)throw Error(msg);checks++;};for(const amp of [160,250,400]){const blob=await exportWorkbook(buffer,JSZip,{project:{object:'Musterweg 12, 8000 Zürich',deliveryDate:'2026-10-29',timeBudget:'40 h',amp,icp:10,city:'Zürich',pl:'Kunden-PL'},fields:[],devices:[]}),w=await readWorkbook(await blob.arrayBuffer(),JSZip);ok(w.get('Deckblatt Neu','C12')==='Musterweg 12, 8000 Zürich','Objekt');ok(w.get('Deckblatt Neu','C16')===46324,'Termin');ok(w.get('Deckblatt Neu','C18')==='40 h','Zeit');ok(w.get('Deckblatt Neu','C14')===original.get('Deckblatt Neu','C14'),'Interner PL');for(const addr of ['C6','G6','C8','C10','B23','B25','B27','B29'])ok(w.sheets.get('Deckblatt Neu').cells.get(addr).formula===original.sheets.get('Deckblatt Neu').cells.get(addr).formula,'Formel '+addr);ok(w.get('Stücknachweis','C36')===(amp>250?'ü':''),'C36');ok(w.get('Stücknachweis','C37')===(amp<=250?'ü':''),'C37');for(const addr of ['C36','C37'])ok(w.sheets.get('Stücknachweis').cells.get(addr).node.getAttribute('s')===original.sheets.get('Stücknachweis').cells.get(addr).node.getAttribute('s'),'Hakenstil');}out.textContent=checks+' Prüfungen bestanden: Originalvorlage, Export und erneuter Import; 160/250/400 A, Deckblatt, interner PL, Formeln und Hakenformat.';}catch(err){out.textContent='FEHLER: '+err.message;}};
</script></html>
