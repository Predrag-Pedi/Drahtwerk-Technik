name: EW PDF-Liste aktualisieren
on:
  push:
    branches: [main]
    paths:
      - 'EW/**'
      - 'ew-ordner.json'
      - 'scripts/ew_index.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pdf-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python ew_index.py
      - name: Dateiliste speichern
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ew-dateien.json
          if ! git diff --cached --quiet; then
            git commit -m 'EW PDF-Liste aktualisiert'
            git push
          fi
