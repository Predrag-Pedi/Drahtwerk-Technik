<script>
const folderIcon='<svg width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2Z" fill="#2b78bb"/><path d="M2 10h20" stroke="#b9daf4" stroke-width="1.3"/></svg>';
let folders=[];let selected=null;const $=id=>document.getElementById(id);
function showFolders(){selected=null;$('overview').classList.remove('ew-hidden');$('detail').classList.add('ew-hidden');history.replaceState(null,'',location.pathname);drawFolders()}
function drawFolders(){const q=$('search').value.trim().toLocaleLowerCase('de-CH');$('folders').replaceChildren();for(const f of folders.filter(x=>x.name.toLocaleLowerCase('de-CH').includes(q))){const b=document.createElement('button');b.className='ew-folder';const t=document.createElement('span');t.textContent=f.name;const small=document.createElement('small');small.textContent=f.files.length+' PDF'+(f.files.length===1?'':'s');t.append(small);b.innerHTML=folderIcon;b.append(t);b.onclick=()=>showDetail(f.name);$('folders').append(b)}if(!$('folders').children.length)$('folders').textContent='Kein Elektrizitätswerk gefunden.'}
function showDetail(name){const f=folders.find(x=>x.name===name);if(!f)return;selected=name;$('overview').classList.add('ew-hidden');$('detail').classList.remove('ew-hidden');$('ewname').textContent=name;$('docs').replaceChildren();const info=(f.info||'').trim();$('ewInfo').classList.toggle('ew-hidden',!info);$('ewInfoTitle').textContent='Informationen zu '+name;$('ewInfoText').textContent=info;history.replaceState(null,'','#'+encodeURIComponent(name));if(!f.files.length){const p=document.createElement('p');p.className='ew-empty';p.textContent='Noch keine PDFs hinterlegt. Lade die Dateien im GitHub-Ordner EW/'+name+'/ hoch.';$('docs').append(p)}else{for(const file of f.files){const row=document.createElement('div');row.className='ew-doc';const b=document.createElement('button');b.textContent='📄 '+file.split('/').pop();b.onclick=()=>openDoc(file);row.append(b);$('docs').append(row)}}}
let pdfDocument=null,pdfPage=1,pdfScale=1,pdfRenderToken=0,pdfSearchToken=0;
let pdfSheets=[],pdfObserver=null,pdfRenderQueue=[],pdfRendering=false,pdfScrollTimer=null;
const pdfLib=window.pdfjsLib;
if(pdfLib)pdfLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function pdfMessage(message){$('pdfStatus').textContent=message}
function pdfResetView(){
 pdfRenderToken++;
 if(pdfObserver){pdfObserver.disconnect();pdfObserver=null}
 pdfRenderQueue=[];pdfSheets=[];$('pdfPages').replaceChildren();
}
function closePdf(){
 pdfSearchToken++;pdfResetView();pdfDocument=null;
 $('pdfReader').classList.add('ew-hidden');document.body.classList.remove('pdf-open');
 $('pdfSearchResults').style.display='none';$('pdfSearchResults').replaceChildren();$('pdfSearch').value='';
}
function pdfUpdateToolbar(){
 if(!pdfDocument)return;
 $('pdfPage').value=pdfPage;$('pdfTotal').textContent='/ '+pdfDocument.numPages;
 $('pdfZoomLabel').textContent=Math.round(pdfScale*100)+' %';
 $('pdfPrev').disabled=pdfPage<=1;$('pdfNext').disabled=pdfPage>=pdfDocument.numPages;
}
function pdfTrackScroll(){
 if(!pdfSheets.length||!pdfDocument)return;
 const view=$('pdfScroll'), mid=view.scrollTop+view.clientHeight*.35;
 let low=0,high=pdfSheets.length-1;
 while(low<high){const m=Math.floor((low+high+1)/2);if(pdfSheets[m].node.offsetTop-pdfSheets[0].node.offsetTop<=mid)low=m;else high=m-1}
 pdfPage=low+1;pdfUpdateToolbar();pdfMessage('Seite '+pdfPage+' von '+pdfDocument.numPages);
}
function pdfEnqueue(index){
 const item=pdfSheets[index];if(!item||item.canvas||item.queued)return;
 item.queued=true;pdfRenderQueue.push(index);pdfDrainQueue();
}
async function pdfDrainQueue(){
 if(pdfRendering)return;pdfRendering=true;
 while(pdfRenderQueue.length){
  const index=pdfRenderQueue.shift(),item=pdfSheets[index],doc=pdfDocument,token=pdfRenderToken;
  if(!item||!doc||!item.visible){if(item)item.queued=false;continue}
  try{
   const page=await doc.getPage(index+1);
   if(token!==pdfRenderToken)break;
   const viewport=page.getViewport({scale:pdfScale});
   const canvas=document.createElement('canvas'),ratio=Math.min(window.devicePixelRatio||1,1.6);
   canvas.width=Math.round(viewport.width*ratio);canvas.height=Math.round(viewport.height*ratio);
   canvas.style.width=viewport.width+'px';canvas.style.height=viewport.height+'px';
   await page.render({canvasContext:canvas.getContext('2d'),viewport,transform:ratio===1?null:[ratio,0,0,ratio,0,0]}).promise;
   if(token!==pdfRenderToken)break;
   if(item.visible){item.node.append(canvas);item.canvas=canvas}
  }catch(e){console.error('PDF-Seite '+(index+1),e)}
  finally{if(item)item.queued=false}
 }
 pdfRendering=false;
 // Nach einem Wechsel des Dokuments kann eine alte Render-Aufgabe noch auslaufen.
 if(pdfRenderQueue.length)pdfDrainQueue();
}
async function pdfBuildPages(anchor=1){
 if(!pdfDocument)return;
 pdfResetView();const token=pdfRenderToken,doc=pdfDocument;
 pdfMessage('Seitenansicht wird vorbereitet …');
 const container=$('pdfPages');
 for(let i=0;i<doc.numPages;i++){
  try{
   const page=await doc.getPage(i+1);if(token!==pdfRenderToken)return;
   const vp=page.getViewport({scale:pdfScale});
   const node=document.createElement('div');node.className='pdf-sheet';
   node.style.width=vp.width+'px';node.style.height=vp.height+'px';
   node.dataset.page=String(i+1);
   const label=document.createElement('span');label.className='pdf-sheet-label';label.textContent='Seite '+(i+1);node.append(label);
   container.append(node);pdfSheets.push({node,canvas:null,queued:false,visible:false});
  }catch(e){console.error(e);if(token===pdfRenderToken)pdfMessage('Eine PDF-Seite konnte nicht vorbereitet werden.')}
 }
 if(token!==pdfRenderToken)return;
 pdfObserver=new IntersectionObserver(entries=>{
  for(const entry of entries){
   const item=pdfSheets[Number(entry.target.dataset.page)-1];if(!item)continue;
   item.visible=entry.isIntersecting;
   if(item.visible)pdfEnqueue(Number(entry.target.dataset.page)-1);
   else if(item.canvas){item.canvas.remove();item.canvas=null}
  }
 },{root:$('pdfScroll'),rootMargin:'800px 300px'});
 pdfSheets.forEach(item=>pdfObserver.observe(item.node));
 pdfUpdateToolbar();setPdfPage(anchor);
}
function setPdfPage(n){
 if(!pdfDocument||!pdfSheets.length)return;
 pdfPage=Math.min(pdfDocument.numPages,Math.max(1,Math.floor(Number(n)||1)));
 const scroll=$('pdfScroll'),node=pdfSheets[pdfPage-1].node;
 scroll.scrollTop=node.offsetTop-pdfSheets[0].node.offsetTop;
 pdfUpdateToolbar();pdfMessage('Seite '+pdfPage+' von '+pdfDocument.numPages);
}
function setPdfZoom(z){
 if(!pdfDocument)return;
 const next=Math.max(.5,Math.min(3,z));if(Math.abs(next-pdfScale)<.001)return;

}
async function openDoc(path){
 const url=path.split('/').map(encodeURIComponent).join('/');
 pdfSearchToken++;pdfResetView();pdfDocument=null;pdfPage=1;pdfScale=1;
 $('pdfReader').classList.remove('ew-hidden');document.body.classList.add('pdf-open');
 $('pdfTitle').textContent=path.split('/').pop();$('pdfExternal').href=url;
 $('pdfSearchResults').replaceChildren();$('pdfSearchResults').style.display='none';$('pdfSearch').value='';
 pdfMessage('PDF wird geladen …');const token=pdfRenderToken;
 if(!pdfLib){pdfMessage('PDF-Reader konnte nicht geladen werden. Internetverbindung prüfen oder «PDF separat öffnen» wählen.');return}
 try{
  const doc=await pdfLib.getDocument({url}).promise;
  if(token!==pdfRenderToken)return;
  pdfDocument=doc;const first=await doc.getPage(1);
  if(token!==pdfRenderToken)return;
  const vp=first.getViewport({scale:1});
  pdfScale=Math.min(1.6,Math.max(.5,($('pdfScroll').clientWidth-24)/vp.width));
  await pdfBuildPages(1);
 }catch(e){console.error(e);if(token===pdfRenderToken)pdfMessage('PDF konnte nicht geladen werden. Bitte «PDF separat öffnen» verwenden.')}
}
async function searchPdf(){
 if(!pdfDocument)return;
 const query=$('pdfSearch').value.trim().toLocaleLowerCase('de-CH');
 const results=$('pdfSearchResults');results.replaceChildren();
 if(!query){results.style.display='none';return}
 const token=++pdfSearchToken,doc=pdfDocument;
 results.style.display='block';pdfMessage('Durchsuche '+doc.numPages+' Seiten …');
 let count=0;
 for(let i=1;i<=doc.numPages;i++){
  if(token!==pdfSearchToken||doc!==pdfDocument)return;
  try{
   const page=await doc.getPage(i),content=await page.getTextContent();
   const text=content.items.map(x=>x.str||'').join(' ');
   const pos=text.toLocaleLowerCase('de-CH').indexOf(query);
   if(pos!==-1){
    count++;const b=document.createElement('button');
    b.textContent='Seite '+i+' · …'+text.slice(Math.max(0,pos-45),Math.min(text.length,pos+query.length+65)).trim()+'…';
    b.onclick=()=>{setPdfPage(i);results.style.display='none'};results.append(b);
   }
  }catch(e){console.error('PDF-Suche, Seite '+i,e)}
 }
 if(token!==pdfSearchToken)return;
 if(!count){const p=document.createElement('div');p.style.padding='10px';p.textContent='Keine Treffer gefunden (gescannte PDFs ohne Text sind nicht durchsuchbar).';results.append(p)}
 pdfMessage(count+' Seite(n) mit Treffern gefunden.');
}
$('pdfScroll').addEventListener('scroll',()=>{if(pdfScrollTimer)cancelAnimationFrame(pdfScrollTimer);pdfScrollTimer=requestAnimationFrame(pdfTrackScroll)},{passive:true});
$('pdfClose').onclick=closePdf;
$('pdfPrev').onclick=()=>setPdfPage(pdfPage-1);
$('pdfNext').onclick=()=>setPdfPage(pdfPage+1);
$('pdfPage').onchange=()=>setPdfPage($('pdfPage').value);
$('pdfZoomIn').onclick=()=>setPdfZoom(pdfScale*1.25);
$('pdfZoomOut').onclick=()=>setPdfZoom(pdfScale/1.25);
$('pdfSearchBtn').onclick=searchPdf;
$('pdfSearch').onkeydown=e=>{if(e.key==='Enter')searchPdf()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('pdfReader').classList.contains('ew-hidden'))closePdf()});
$('back').onclick=showFolders;$('search').oninput=drawFolders;
fetch('ew-dateien.json?updated='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{folders=data.folders||[];drawFolders();$('status').textContent=folders.length+' Elektrizitätswerke · '+folders.reduce((n,f)=>n+f.files.length,0)+' PDFs';const hash=decodeURIComponent(location.hash.slice(1));if(hash)showDetail(hash)}).catch(e=>{$('status').textContent='Dateiliste konnte nicht geladen werden. Bitte GitHub Pages und ew-dateien.json prüfen.';console.error(e)});
</script><script>if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script></body></html>
