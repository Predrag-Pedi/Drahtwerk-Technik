</style></head><body><header class="dw-header"><h1 class="dw-brand">DRAHTWERK <span>| Technik</span> <span class="dw-bolt">⚡</span></h1></header><nav class="dw-nav" aria-label="Drahtwerk Technik Navigation"><a href="index.html">Schienenrechner</a><a href="technik.html#litzen">Litzen</a><a href="technik.html#kupfer">Kupferschienen</a><a href="technik.html#abb">ABB Smissline</a><a href="ew.html" aria-current="page">EW</a></nav><main class="ew-main"><h1 class="ew-title">Elektrizitätswerke (EW)</h1><p class="ew-intro">Werkvorschriften, Formulare und weitere PDF-Dokumente.</p><div class="ew-card"><div id="overview"><input class="ew-search" id="search" placeholder="Elektrizitätswerk suchen, z. B. EKZ" aria-label="Elektrizitätswerk suchen"><div class="ew-grid" id="folders"></div></div><div id="detail" class="ew-hidden"><div class="ew-row"><button class="ew-back" id="back">← Alle EW</button><strong id="ewname"></strong></div><div id="docs"></div><div id="viewerWrap" class="ew-hidden"><div class="ew-row"><strong id="docname"></strong><a class="ew-open" id="openPdf" target="_blank" rel="noopener">PDF separat öffnen ↗</a></div><iframe class="ew-viewer" id="viewer" title="PDF-Dokument"></iframe><p class="ew-note">Falls Safari das PDF nicht direkt anzeigt, «PDF separat öffnen» verwenden.</p></div></div><p class="ew-note" id="status"></p></div></main><script>
const folderIcon='<svg width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2Z" fill="#2b78bb"/><path d="M2 10h20" stroke="#b9daf4" stroke-width="1.3"/></svg>';
let folders=[];let selected=null;const $=id=>document.getElementById(id);
function showFolders(){selected=null;$('overview').classList.remove('ew-hidden');$('detail').classList.add('ew-hidden');$('viewer').removeAttribute('src');history.replaceState(null,'',location.pathname);drawFolders()}
function drawFolders(){const q=$('search').value.trim().toLocaleLowerCase('de-CH');$('folders').replaceChildren();for(const f of folders.filter(x=>x.name.toLocaleLowerCase('de-CH').includes(q))){const b=document.createElement('button');b.className='ew-folder';const t=document.createElement('span');t.textContent=f.name;const small=document.createElement('small');small.textContent=f.files.length+' PDF'+(f.files.length===1?'':'s');t.append(small);b.innerHTML=folderIcon;b.append(t);b.onclick=()=>showDetail(f.name);$('folders').append(b)}if(!$('folders').children.length)$('folders').textContent='Kein Elektrizitätswerk gefunden.'}
function showDetail(name){const f=folders.find(x=>x.name===name);if(!f)return;selected=name;$('overview').classList.add('ew-hidden');$('detail').classList.remove('ew-hidden');$('ewname').textContent=name;$('viewerWrap').classList.add('ew-hidden');$('viewer').removeAttribute('src');$('docs').replaceChildren();history.replaceState(null,'','#'+encodeURIComponent(name));if(!f.files.length){const p=document.createElement('p');p.className='ew-empty';p.textContent='Noch keine PDFs hinterlegt. Lade die Dateien im GitHub-Ordner EW/'+name+'/ hoch.';$('docs').append(p)}else{for(const file of f.files){const row=document.createElement('div');row.className='ew-doc';const b=document.createElement('button');b.textContent='📄 '+file.split('/').pop();b.onclick=()=>openDoc(file);row.append(b);$('docs').append(row)}}}
function openDoc(path){const parts=path.split('/').map(encodeURIComponent);const url=parts.join('/');$('docname').textContent=path.split('/').pop();$('openPdf').href=url;$('viewer').src=url;$('viewerWrap').classList.remove('ew-hidden');$('viewerWrap').scrollIntoView({behavior:'smooth',block:'nearest'})}
$('back').onclick=showFolders;$('search').oninput=drawFolders;
fetch('ew-dateien.json?updated='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{folders=data.folders||[];drawFolders();$('status').textContent=folders.length+' Elektrizitätswerke · '+folders.reduce((n,f)=>n+f.files.length,0)+' PDFs';const hash=decodeURIComponent(location.hash.slice(1));if(hash)showDetail(hash)}).catch(e=>{$('status').textContent='Dateiliste konnte nicht geladen werden. Bitte GitHub Pages und ew-dateien.json prüfen.';console.error(e)});
</script><script>if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script></body></html>
