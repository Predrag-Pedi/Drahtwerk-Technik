<!DOCTYPE html>
<html lang="de-CH"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#103d73" name="theme-color"/><title>Drahtwerk | Aufbauabstände</title><link href="manifest.webmanifest" rel="manifest"/><link href="icon-192.png" rel="apple-touch-icon"/><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f8;color:#172d46;font:15px Arial,Helvetica,sans-serif}.dw-header{background:#103d73;color:#fff;padding:14px max(18px,3vw) 0}.dw-brand{font-size:25px;font-weight:900;letter-spacing:.5px;line-height:1.2}.dw-brand span{font-weight:400;color:#b9d6f5}.dw-brand .bolt{color:#ff9d24;font-weight:900}.dw-nav{display:flex;gap:7px;overflow-x:auto;padding:12px max(18px,3vw) 0;background:#103d73}.dw-nav a{display:block;padding:13px 18px;white-space:nowrap;color:#fff;background:#2c5786;text-decoration:none;font-weight:700;border-radius:10px 10px 0 0}.dw-nav a[aria-current=page]{background:#edf2f8;color:#103d73}main{max-width:1250px;margin:auto;padding:20px 18px 50px}h1{font-size:24px;margin:0 0 6px}.intro{color:#60738b;margin:0 0 16px}.card{background:#fff;border-radius:13px;box-shadow:0 5px 18px #142e4c12;padding:16px}.folders{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.folder{border:1px solid #d8e4f0;background:#f9fbff;border-radius:10px;padding:15px 12px;text-align:left;cursor:pointer;color:#173d69;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;min-height:64px}.folder:hover,.folder:focus-visible{background:#e6f1fc;border-color:#8db6df}.folder small{display:block;color:#71839a;font-size:11px;font-weight:400;margin-top:3px}.hidden{display:none!important}.detail-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:14px;flex-wrap:wrap}.back,.close{border:0;border-radius:8px;background:#1767ac;color:#fff;padding:11px 15px;font:700 14px Arial;cursor:pointer}.detail-title{font-size:18px}.drawing{border:1px solid #dbe5ef;border-radius:10px;padding:13px;margin:0 0 16px;background:#fff}.drawing h2{font-size:15px;margin:0 0 10px;overflow-wrap:anywhere}.drawing img{display:block;width:100%;height:auto;max-height:none;object-fit:contain;cursor:zoom-in;background:#fff}.drawing button{display:block;width:100%;padding:0;border:0;background:#fff;cursor:zoom-in}.hint{font-size:12px;color:#65778d;margin:12px 0 0}.empty{padding:16px;background:#f1f5fa;border-radius:8px;color:#63748a}.lightbox{position:fixed;inset:0;z-index:2000;background:#15253beF;display:flex;flex-direction:column}.lightbar{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:9px 14px;background:#103d73;color:#fff}.lightbar strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lightview{flex:1;min-height:0;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:15px;touch-action:pan-x pan-y}.lightview img{display:block;max-width:none;transform-origin:top center;background:white;box-shadow:0 3px 16px #0005}.lightbar button{border:1px solid #7ea5cd;background:#2c5786;color:white;padding:9px 13px;border-radius:7px;min-height:42px;font-size:15px}.zoomline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}body.modal-open{overflow:hidden}@media(max-width:900px){.folders{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){.dw-brand{font-size:20px}.dw-nav a{font-size:13px;padding:11px 12px}main{padding:12px}.folders{grid-template-columns:repeat(2,minmax(0,1fr))}.folder{font-size:12px;padding:10px}.drawing{padding:8px}.lightbar{flex-wrap:wrap}}
</style><style>
/* Drahtwerk Startseiten-Navigation – iPad */
.dw-home-link{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:#285c90;color:#fff;text-decoration:none;border:1px solid #729bc5;border-radius:11px;padding:10px 17px;font:700 15px Arial,Helvetica,sans-serif;min-height:45px;white-space:nowrap}.dw-home-link:hover,.dw-home-link:focus-visible{background:#3679ba;outline:2px solid #a6d5ff}.dw-home-link svg{width:21px;height:21px;flex:none}.dw-header{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:15px!important;padding-bottom:13px!important}.dw-header p{display:none!important}@media(max-width:600px){.dw-home-link{padding:9px 12px;font-size:13px}}@media print{.dw-home-link{display:none!important}}
</style></head><body><header class="dw-header"><div class="dw-brand">DRAHTWERK <span>| Technik</span> <span class="bolt">⚡</span></div><a aria-label="Zur Startseite" class="dw-home-link" href="index.html"><svg aria-hidden="true" fill="none" height="22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="22" xmlns="http://www.w3.org/2000/svg"><path d="m3 10 9-7 9 7"></path><path d="M5 9v12h14V9"></path><path d="M9 21v-7h6v7"></path></svg> Startseite</a></header><main><h1>Aufbauabstände</h1><p class="intro">Technische Aufbauzeichnungen und Schienenabstände – nach Kategorien geordnet.</p><div class="card"><div id="overview"><div class="folders" id="folders"></div></div><div class="hidden" id="detail"><div class="detail-head"><button class="back" id="back" type="button">← Alle Kategorien</button><strong class="detail-title" id="categoryName"></strong></div><div id="drawings"></div></div><p class="hint" id="status">Kategorien werden geladen …</p></div></main><div aria-label="Zeichnung vergrössern" aria-modal="true" class="lightbox hidden" id="lightbox" role="dialog"><div class="lightbar"><strong id="imageName"></strong><div class="zoomline"><button id="zoomOut" type="button">−</button><span id="zoomValue">100 %</span><button id="zoomIn" type="button">+</button><button id="close" type="button">✕ Schliessen</button></div></div><div class="lightview" id="lightview"><img alt="Vergrösserte Aufbauzeichnung" id="bigImage"/></div></div><script>
const $=id=>document.getElementById(id);let categories=[],selected=null,zoom=1;
function imageUrl(path){return path.split('/').map(encodeURIComponent).join('/')}
function showCategories(){selected=null;$('overview').classList.remove('hidden');$('detail').classList.add('hidden');$('status').textContent=categories.length+' Kategorien';history.replaceState(null,'',location.pathname);window.scrollTo(0,0)}
function openCategory(name){const c=categories.find(x=>x.name===name);if(!c)return;selected=name;$('overview').classList.add('hidden');$('detail').classList.remove('hidden');$('categoryName').textContent=c.name;$('drawings').replaceChildren();for(const entry of c.images){const card=document.createElement('article');card.className='drawing';const h=document.createElement('h2');h.textContent=entry.name;const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',entry.name+' vergrössern');const img=document.createElement('img');img.src=imageUrl(entry.path);img.alt=entry.name;img.loading='lazy';b.append(img);b.onclick=()=>openImage(entry);card.append(h,b);$('drawings').append(card)}if(!c.images.length){const p=document.createElement('p');p.className='empty';p.textContent='In dieser Kategorie sind noch keine Bilder hinterlegt.';$('drawings').append(p)}$('status').textContent=c.images.length+' Zeichnung(en)';history.replaceState(null,'','#'+encodeURIComponent(name));window.scrollTo(0,0)}
function drawFolders(){$('folders').replaceChildren();for(const c of categories){const b=document.createElement('button');b.type='button';b.className='folder';const icon=document.createElement('span');icon.textContent='📁';icon.style.fontSize='25px';const label=document.createElement('span');label.textContent=c.name;const sub=document.createElement('small');sub.textContent=c.images.length+' Bild(er)';label.append(sub);b.append(icon,label);b.onclick=()=>openCategory(c.name);$('folders').append(b)}if(!categories.length){const p=document.createElement('p');p.className='empty';p.textContent='Noch keine Kategorien vorhanden.';$('folders').append(p)}}
function resizeImage(){const img=$('bigImage'),viewport=$('lightview');if(!img.naturalWidth)return;const fit=Math.min((viewport.clientWidth-30)/img.naturalWidth,(viewport.clientHeight-30)/img.naturalHeight,1);img.style.width=Math.max(1,Math.round(img.naturalWidth*fit*zoom))+'px';img.style.height='auto';$('zoomValue').textContent=Math.round(zoom*100)+' %'}
function openImage(entry){zoom=1;$('imageName').textContent=entry.name;$('bigImage').onload=resizeImage;$('bigImage').src=imageUrl(entry.path);$('lightbox').classList.remove('hidden');document.body.classList.add('modal-open');$('lightview').scrollTop=0;$('lightview').scrollLeft=0;resizeImage()}
function closeImage(){$('lightbox').classList.add('hidden');document.body.classList.remove('modal-open');$('bigImage').removeAttribute('src')}
$('back').onclick=showCategories;$('close').onclick=closeImage;$('zoomIn').onclick=()=>{zoom=Math.min(5,zoom*1.3);resizeImage()};$('zoomOut').onclick=()=>{zoom=Math.max(.5,zoom/1.3);resizeImage()};window.addEventListener('resize',()=>{if(!$('lightbox').classList.contains('hidden'))resizeImage()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('lightbox').classList.contains('hidden'))closeImage()});
fetch('aufbau-dateien.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{categories=Array.isArray(data.folders)?data.folders.filter(x=>typeof x.name==='string'&&Array.isArray(x.images)):[];drawFolders();const name=decodeURIComponent(location.hash.slice(1));if(name&&categories.some(x=>x.name===name))openCategory(name);else $('status').textContent=categories.length+' Kategorien'}).catch(e=>{$('status').textContent='Die Bilderliste konnte nicht geladen werden. Bitte aufbau-dateien.json hochladen und den GitHub-Workflow prüfen.';console.error(e)});
</script><script>if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script></body></html>
